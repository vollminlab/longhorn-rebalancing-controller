apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "longhorn-rebalancing-controller.fullname" . }}-configmap
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "longhorn-rebalancing-controller.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
