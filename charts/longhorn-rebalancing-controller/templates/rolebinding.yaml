apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "longhorn-rebalancing-controller.fullname" . }}-configmap
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "longhorn-rebalancing-controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "longhorn-rebalancing-controller.fullname" . }}-configmap
subjects:
  - kind: ServiceAccount
    name: {{ include "longhorn-rebalancing-controller.serviceAccountName" . }}
    namespace: {{ .Values.namespace }}
