image:
  repository: harbor.vollminlab.com/vollminlab/longhorn-rebalancing-controller
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Always deploy into longhorn-system so the controller has pod-level access
# to Longhorn resources without cross-namespace network policy headaches.
namespace: longhorn-system

config:
  dryRun: true
  # Minimum actual free disk (% of Longhorn disk capacity) a destination node
  # must retain after absorbing an evicted replica. Keep above the
  # NodeDiskSpaceLow alert threshold (20%).
  minDestinationFreePct: 25
  rebalance:
    nodeUsageThreshold: 75
    maxEvictionsPerDay: 2
    cooldownMinutes: 30
    maintenanceWindow: "02:00-05:00"
    smallestFirst: true
    graduateAfterCycles: 3
  steadyState:
    imbalanceRatio: 1.5
    maxEvictionsPerDay: 5
    cooldownMinutes: 10
  move:
    # A surge-move past this age is aborted (surged replica deleted, source
    # kept, spec restored). Surge rebuild is ~20 min per 100 GiB.
    timeoutMinutes: 90
    # Aborted moves count here, not against maxEvictionsPerDay; once reached,
    # no new moves start until the next day.
    maxFailuresPerDay: 3
    # A volume is kept off the victim list for this long after it is moved, so a
    # single volume can't be shuffled repeatedly within a convergence run. 0
    # disables the backoff.
    perVolumeBackoffMinutes: 360

resources:
  limits:
    cpu: 100m
    memory: 64Mi
  requests:
    cpu: 10m
    memory: 32Mi

nameOverride: ""
fullnameOverride: ""
